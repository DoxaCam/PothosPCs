
{% extends "base.html" %}

{% block title %}{{ pc.model_name }} | PothosPCs{% endblock %}

{% block content %}

<section class="container py-5">

    <a href="{{ url_for('products.shop') }}" class="btn btn-outline-dark mb-4">
        &larr; Back to Shop
    </a>

    <div class="row g-5 align-items-center">

        <div class="col-md-6">
            <div class="bg-light rounded p-5 text-center">
                <h1 class="display-1">🖥️</h1>
                <p class="text-muted">PC Image Coming Soon</p>
            </div>
        </div>

        <div class="col-md-6">

            <span class="badge bg-dark mb-3">
                {{ pc.type }}
            </span>

            <h1 class="fw-bold">
                {{ pc.model_name }}
            </h1>

            <h2 class="my-4">
                ${{ "%.2f"|format(pc.price) }}
            </h2>

            <h5>Specifications</h5>

            <p class="text-muted">
                {{ pc.specs }}
            </p>

            <button class="btn btn-dark btn-lg mt-3" disabled>
                Add to Cart (Coming Soon)
            </button>

        </div>

    </div>

</section>

{% endblock %}
